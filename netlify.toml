[build.environment]
  # Turbopack's build cache can contain server-only env values (e.g.
  # RESEND_API_KEY) as part of its internal state — never in shipped
  # output. Scope the secrets scanner away from the cache dir instead of
  # omitting the key itself, so a real leak into client-shipped code is
  # still caught.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
